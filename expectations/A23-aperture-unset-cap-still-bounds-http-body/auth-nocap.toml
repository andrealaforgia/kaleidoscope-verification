# A23 fixture: a COMPLETE, valid ingest-auth config with NO body-size cap
# configured anywhere (the "unset / no-cap" path). Per body_size_cap.rs
# DD2/C2, the unset path must be "byte-for-byte today's behaviour". Note:
# NO max_recv_msg_size key is present (not even the forward-compat
# per-transport one) so this is unambiguously the no-cap path.
[aperture.transport.grpc]
bind_addr = "0.0.0.0:4317"
max_concurrent_requests = 16

[aperture.transport.http]
bind_addr = "0.0.0.0:4318"
max_concurrent_requests = 16

[aperture.sink]
kind = "stub"

[aperture.shutdown]
drain_deadline_ms = 5000

[aperture.security.tls]
enabled = false
cert_path = ""
key_path = ""

[aperture.security.auth.spiffe]
enabled = false
workload_api_socket = ""
trust_domain = ""

[aperture.security.auth.jwt]
issuer = "acme-observability"
audience = "kaleidoscope-ingest"
secret_file = "/etc/aperture/hs256.key"
catalogue_path = "/etc/aperture/tenants.toml"
