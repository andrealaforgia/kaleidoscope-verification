# A24 fixture: a COMPLETE valid ingest-auth config that SETS
# max_recv_msg_size = 16384 (16 KiB) in BOTH transport arms — exactly the
# [aperture.transport.{grpc,http}] location ADR-0073 (Decision, line 67) says
# `into_config` reads it from ("exactly as concurrency does"). An operator who
# sets this expects a 16 KiB ingest body cap.
[aperture.transport.grpc]
bind_addr = "0.0.0.0:4317"
max_recv_msg_size = 16384
max_concurrent_requests = 16

[aperture.transport.http]
bind_addr = "0.0.0.0:4318"
max_recv_msg_size = 16384
max_concurrent_requests = 16

[aperture.sink]
kind = "stub"

[aperture.shutdown]
drain_deadline_ms = 5000

[aperture.security.tls]
enabled = false
cert_path = ""
key_path = ""

[aperture.security.auth.spiffe]
enabled = false
workload_api_socket = ""
trust_domain = ""

[aperture.security.auth.jwt]
issuer = "acme-observability"
audience = "kaleidoscope-ingest"
secret_file = "/etc/aperture/hs256.key"
catalogue_path = "/etc/aperture/tenants.toml"
