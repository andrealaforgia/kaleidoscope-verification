# Harness for verifying kaleidoscope expectations.
#
# Two services on a single bridge network:
# - aperture: built from the live kaleidoscope source tree at
#   ${KALEIDOSCOPE_DIR}.
# - otelcol-sink: stable third-party OTLP receiver -> file exporter,
#   provides ground-truth evidence of forwarded payloads.
#
# Bring up:    docker compose up -d --build
# Tear down:   docker compose down --volumes --remove-orphans

name: kaleidoscope-expectations

services:
  aperture:
    build:
      context: .
      dockerfile: Dockerfile.aperture
      additional_contexts:
        kaleidoscope: ${KALEIDOSCOPE_DIR:-../../kaleidoscope}
    image: kaleidoscope-expectations/aperture:under-test
    command: ["--config", "/etc/aperture/aperture.toml"]
    volumes:
      # Per-expectation aperture.toml override: when an expectation
      # ships its own ./aperture.toml in its directory,
      # run-expectation.sh sets APERTURE_TOML to that absolute path
      # so compose mounts it instead of the harness default.
      - ${APERTURE_TOML:-./aperture.toml}:/etc/aperture/aperture.toml:ro
      # Mandatory ingest auth (aegis-ingest-auth-v0, N29): the HS256
      # secret + tenant catalogue the [aperture.security.auth.jwt] block
      # references. Senders mint a matching token via mint-ingest-jwt.sh.
      - ./jwt.secret:/etc/aperture/jwt.secret:ro
      - ./tenants.toml:/etc/aperture/tenants.toml:ro
    environment:
      # RUST_LOG always set; APERTURE__* env vars are listed without
      # values so they pass through from the calling shell only when
      # set (per-expectation `.env-overrides` mechanism).
      RUST_LOG: ${APERTURE_LOG:-info}
      APERTURE__TRANSPORT__GRPC__MAX_CONCURRENT_REQUESTS:
      APERTURE__TRANSPORT__HTTP__MAX_CONCURRENT_REQUESTS:
      APERTURE__SHUTDOWN__DRAIN_DEADLINE_MS:
      APERTURE__SINK__KIND:
      APERTURE__SINK__FORWARDING__ENDPOINT:
      APERTURE__SINK__FORWARDING__TIMEOUT_MS:
    ports:
      # Host-side ports for direct OTLP traffic in scenario runners.
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - otelcol-sink

  otelcol-sink:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otelcol-sink.yaml:/etc/otelcol/config.yaml:ro
      # Host bind so the file-exporter output is visible to
      # run-expectation.sh without docker cp.
      - ./.captured:/captured

  # Spark consumer test fixture. Built from harness/spark-consumer/
  # plus the kaleidoscope snapshot. The service is declared with
  # profile=fixture so `docker compose up` doesn't start it
  # automatically; per-expectation runners invoke it via
  # `docker compose run --rm spark-consumer <scenario flags>`.
  spark-consumer:
    profiles: ["fixture"]
    build:
      context: .
      dockerfile: Dockerfile.spark-consumer
      additional_contexts:
        kaleidoscope: ${KALEIDOSCOPE_DIR:-../../kaleidoscope}
    image: kaleidoscope-expectations/spark-consumer:under-test
    environment:
      RUST_LOG: ${SPARK_CONSUMER_LOG:-info}
